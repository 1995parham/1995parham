<title>Star Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FBFCF9; --surface:#FFFFFF; --sunk:#F3F6EE; --border:#E2E7DC; --border-hi:#CBD4C0;
  --text:#14180F; --muted:#5F6B54; --faint:#8B9680;
  --accent:#A1E477; --accent-ink:#3F6415; --accent-soft:#EDF8E0;
  --warn:#8A6410; --warn-soft:#FBF1D9; --danger:#A63F28; --danger-soft:#FBE9E4;
  --shadow:0 1px 2px rgba(20,24,15,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1310; --surface:#171C15; --sunk:#12160F; --border:#2A3226; --border-hi:#3C4636;
  --text:#E8EEE2; --muted:#97A38C; --faint:#6E7A64;
  --accent:#A1E477; --accent-ink:#A1E477; --accent-soft:#1E2A16;
  --warn:#E0B84E; --warn-soft:#2A2413; --danger:#E27A61; --danger-soft:#2E1A15;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0F1310; --surface:#171C15; --sunk:#12160F; --border:#2A3226; --border-hi:#3C4636;
  --text:#E8EEE2; --muted:#97A38C; --faint:#6E7A64;
  --accent:#A1E477; --accent-ink:#A1E477; --accent-soft:#1E2A16;
  --warn:#E0B84E; --warn-soft:#2A2413; --danger:#E27A61; --danger-soft:#2E1A15;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px 80px}

/* ---- masthead ---- */
header{padding:44px 0 26px;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;justify-content:space-between}
h1{font-family:Archivo,ui-sans-serif,sans-serif;font-weight:800;font-size:clamp(30px,4.4vw,46px);
  letter-spacing:-.022em;margin:0;text-wrap:balance;line-height:1.05}
h1 .dot{color:var(--accent-ink)}
.sub{color:var(--muted);margin:9px 0 0;max-width:62ch}
.who{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;color:var(--faint);
  text-transform:uppercase;letter-spacing:.12em;margin:0 0 10px}

/* ---- stat strip ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;
  background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin:0 0 30px}
.stat{background:var(--surface);padding:15px 16px}
.stat b{display:block;font-family:Archivo,sans-serif;font-weight:800;font-size:27px;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.stat.hl b{color:var(--accent-ink)}
.stat.warn b{color:var(--danger)}

/* ---- controls ---- */
.controls{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:12px 0 11px;border-bottom:1px solid var(--border);margin-bottom:4px}
.searchrow{display:flex;gap:9px;flex-wrap:wrap}
input[type=search]{flex:1 1 260px;min-width:0;font:inherit;font-size:14px;padding:9px 13px;border-radius:8px;
  border:1px solid var(--border-hi);background:var(--surface);color:var(--text)}
input[type=search]:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:1px}
select{font:inherit;font-size:13.5px;padding:9px 11px;border-radius:8px;border:1px solid var(--border-hi);
  background:var(--surface);color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border-hi);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip:hover{border-color:var(--accent-ink);color:var(--text)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent-ink);color:var(--accent-ink);font-weight:600}
.chip .n{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}

/* ---- results ---- */
.count{font-size:12.5px;color:var(--muted);padding:11px 2px 7px;font-variant-numeric:tabular-nums;
  display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rows{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;padding:11px 15px;
  border-bottom:1px solid var(--border);align-items:baseline}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.nm{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13.5px;font-weight:600;
  color:var(--text);text-decoration:none;overflow-wrap:anywhere}
.nm:hover{color:var(--accent-ink);text-decoration:underline}
.nm .ow{font-weight:400;color:var(--faint)}
.dsc{grid-column:1;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.meta{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;padding:2px 8px;border-radius:5px;white-space:nowrap;
  font-family:"IBM Plex Mono",monospace;letter-spacing:.01em}
.t-cur{background:var(--sunk);color:var(--muted);border:1px solid var(--border)}
.t-new{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);font-weight:600}
.t-fresh{background:var(--accent-soft);color:var(--accent-ink);border:1px dashed var(--accent-ink);font-weight:600}
.t-cut{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.t-rev{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.st{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;
  min-width:52px;text-align:right}
.lg{font-size:11.5px;color:var(--faint);min-width:74px;text-align:right}
.more{display:block;width:100%;margin-top:14px;padding:11px;font:inherit;font-size:13.5px;cursor:pointer;
  border:1px dashed var(--border-hi);background:transparent;color:var(--muted);border-radius:9px}
.more:hover{border-color:var(--accent-ink);color:var(--accent-ink)}
.empty{padding:44px 18px;text-align:center;color:var(--faint)}
mark{background:var(--accent-soft);color:var(--accent-ink);padding:0 1px;border-radius:2px}

/* ---- notes ---- */
.note{margin:34px 0 0;padding:17px 19px;border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:9px;background:var(--surface);font-size:13.5px;color:var(--muted)}
.note h2{font-family:Archivo,sans-serif;font-weight:700;font-size:14px;margin:0 0 7px;color:var(--text);
  text-transform:uppercase;letter-spacing:.07em}
.note code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--sunk);
  padding:1px 5px;border-radius:4px;color:var(--text)}
.note p{margin:0 0 8px} .note p:last-child{margin:0}
@media (max-width:620px){
  .row{grid-template-columns:minmax(0,1fr)}
  .meta{grid-column:1;grid-row:auto;justify-content:flex-start;margin-top:3px}
  .st,.lg{min-width:0;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
